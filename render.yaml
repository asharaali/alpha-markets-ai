# Render blueprint for Alpha Markets.
# Dashboard: New + → Blueprint → connect this repo. Render reads this file.
#
# Nothing here is required for the app to work: the research side runs entirely on free,
# unauthenticated data (nflverse, Kalshi market data, Open-Meteo). Kalshi credentials are
# only needed to place real orders, and are entered in the dashboard, never committed.
services:
  - type: web
    name: alpha-markets
    runtime: python
    rootDir: backend
    plan: starter                # always-on, so the snapshot job can record line movement
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATA_DIR
        value: /var/data
      - key: LOG_LEVEL
        value: INFO

      # ---- background jobs ----
      # The snapshot job is what makes line movement and closing-line value possible.
      # There is no way to backfill prices later, so leave this on.
      - key: JOBS_ENABLED
        value: "true"
      - key: MARKET_SNAPSHOT_INTERVAL
        value: "600"
      - key: GRADING_INTERVAL
        value: "1800"

      # ---- model fitting ----
      # Each season is roughly a 19MB download on first boot.
      - key: CALIBRATION_SEASONS
        value: "6"
      - key: HISTORY_SEASONS
        value: "3"

      # ---- risk defaults ----
      - key: DEFAULT_BANKROLL
        value: "1000"
      - key: KELLY_FRACTION
        value: "0.25"

      # ---- live trading: deliberately NOT available on the hosted instance ----
      #
      # No Kalshi credentials are configured here, and there is no env var to paste them
      # into. That is the design, not an omission.
      #
      # What this deployment is FOR is the snapshot job: recording Kalshi order books
      # around the clock so line movement and closing-line value can be measured at all.
      # None of that needs an API key — Kalshi market data is public.
      #
      # What it would ADD by holding the key is a real-money credential sitting on a
      # publicly reachable box, behind nothing but a session cookie and a password. The
      # research value is identical either way, so the key stays on the machine you
      # physically control and place orders from.
      #
      # If you later decide otherwise, add KALSHI_KEY_ID and KALSHI_PRIVATE_KEY as
      # dashboard secrets and flip LIVE_TRADING_ENABLED — but do it as a decision, and
      # give that account a password you do not use anywhere else.
      - key: LIVE_TRADING_ENABLED
        value: "false"

      # ---- optional sportsbook cross-check ----
      - key: ODDS_API_KEY
        sync: false

      - key: SITE_SECRET
        generateValue: true      # stable random secret for signing login cookies
    disk:
      name: data
      mountPath: /var/data       # holds the SQLite database, feed cache and accounts
      sizeGB: 5                  # play-by-play cache is a few hundred MB
