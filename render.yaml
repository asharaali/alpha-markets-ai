# Render deployment blueprint for Alpha Markets AI.
# In the Render dashboard: New + → Blueprint → connect this repo. It reads this file.
# You'll be prompted to enter ODDS_API_KEY (kept secret, not in the repo).
services:
  - type: web
    name: alpha-markets-ai
    runtime: python
    rootDir: backend
    plan: starter            # $7/mo, always-on (notifications run 24/7)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEMO_MODE
        value: "false"
      - key: ODDS_API_KEY
        sync: false          # you paste this into the dashboard (stays secret)
      - key: ODDS_REGIONS
        value: us
      - key: ODDS_CACHE_TTL
        value: "3600"
      - key: NTFY_TOPIC
        value: alpha-markets-ashar-x7k2
      - key: NOTIFY_ENABLED
        value: "true"
      - key: BET_LOG_PATH
        value: /var/data/bet_log.json
    disk:
      name: data
      mountPath: /var/data    # $1/mo, keeps your bet history across restarts
      sizeGB: 1
