<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alpha Markets — NFL Research Terminal</title>
  <meta name="description" content="Quantitative NFL market research: model probabilities, market prices, and the edge between them." />
  <link rel="stylesheet" href="/static/css/terminal.css?v=2.0.7" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0c10'/><path d='M6 22l5-12 5 12M9 18h4M19 10v12M19 10h4a3 3 0 010 6h-4' stroke='%234d8dff' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
</head>
<body>
  <div id="loginGate" class="login-gate" hidden>
    <div class="login-box">
      <h2>Alpha Markets</h2>
      <p>NFL quantitative market research. Sign in to track a portfolio and size positions — research, projections and prices are readable without an account.</p>
      <input id="liUser" placeholder="username" autocomplete="username" autocapitalize="off" />
      <input id="liPass" type="password" placeholder="password" autocomplete="current-password" />
      <div id="liError" class="login-error" role="alert"></div>
      <div class="login-actions">
        <button id="liLogin" class="btn primary">Sign in</button>
        <button id="liSignup" class="btn">Create account</button>
      </div>
      <div class="login-actions" style="margin-top:12px">
        <button id="liSkip" class="btn sm" style="flex:none">Continue without an account</button>
      </div>
    </div>
  </div>

  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">Alpha Markets</div>
        <div class="brand-sub">NFL research terminal</div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div id="footStatus"><span class="status-dot"></span>connecting…</div>
        <div id="footUser" style="margin-top:6px"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="pageTitle">Dashboard</h1>
        <div class="topbar-meta" id="topMeta"></div>
      </header>
      <div class="content" id="view" role="main" aria-live="polite"></div>
    </main>
  </div>

  <script type="module" src="/static/js/app.js?v=2.0.7"></script>
</body>
</html>
